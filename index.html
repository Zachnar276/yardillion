<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Yardillion: a daily NFL and college football rarity trivia game. The rarer your right answer, the more yards you gain.">

<style>:root{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

<title>Yardillion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Graduate&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: a night-game field. Turf-green surfaces, chalk type, one pylon-orange action color, six tier colors for rarity. Single dark look by design. */
:root{
  --turf:#0d2418; --turf-2:#123020; --turf-3:#183d29; --line:rgba(242,239,230,.14);
  --chalk:#f2efe6; --muted:#9db3a5; --pylon:#ff6a1f; --pylon-ink:#1a0d04;
  --t0:#4a5c51; --t1:#c9d1cb; --t2:#86b9e6; --t3:#72d394; --t4:#f2d14b; --t5:#ff9445; --t6:#ff5a6a;
  --bad:#ff7a7a;
  --f-display:"Graduate", "Rockwell", Georgia, serif;
  --f-body:"Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num:"Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--turf);color:var(--chalk);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:20px 48px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--pylon);outline-offset:2px}
.eyebrow{font-family:var(--f-num);text-transform:uppercase;letter-spacing:.14em;font-weight:600;font-size:13px;color:var(--muted)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* ---------- HOME ---------- */
.masthead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.title{font-family:var(--f-display);font-size:clamp(44px,12.5vw,80px);line-height:.9;margin:0;letter-spacing:.01em;text-wrap:balance}
.title span{color:var(--pylon)}
.tag{font-size:18px;color:var(--chalk);max-width:34ch;margin:0}
.field{position:relative;border-radius:6px;overflow:hidden;height:118px;
  background:
   repeating-linear-gradient(90deg,var(--turf-2) 0 10%,var(--turf-3) 10% 20%);
  border:2px solid rgba(242,239,230,.5)}
.field::before{content:"";position:absolute;inset:0 10%;
  background:repeating-linear-gradient(90deg,rgba(242,239,230,.55) 0 2px,transparent 2px 12.5%);}
.ez{position:absolute;top:0;bottom:0;width:10%;display:grid;place-items:center;background:#0a1d13;border-right:2px solid rgba(242,239,230,.5)}
.ez.r{right:0;border-right:0;border-left:2px solid rgba(242,239,230,.5)}
.ez b{font-family:var(--f-display);font-size:13px;writing-mode:vertical-rl;transform:rotate(180deg);color:var(--muted);letter-spacing:.2em}
.ez.r b{transform:none}
.yn{position:absolute;inset:auto 10% 8px 10%;display:flex;justify-content:space-between;font-family:var(--f-num);font-weight:700;color:rgba(242,239,230,.6);font-size:15px;padding:0 4px}
.yn.top{top:6px;bottom:auto;transform:rotate(180deg)}
.field.sm{height:84px}
.field.sm .yn{font-size:12px;bottom:4px}.field.sm .yn.top{top:3px}
.runner{position:absolute;top:50%;margin:-21px 0 0 -17px;z-index:3;transition:left 1.4s cubic-bezier(.3,.6,.25,1);filter:drop-shadow(0 3px 2px rgba(0,0,0,.45))}
.runner svg{display:block}
.runner .leg,.runner .arm{transform-box:view-box}
.runner .leg{transform-origin:16px 28px}.runner .arm{transform-origin:20px 18px}
.running .l{animation:legA .3s linear infinite alternate}
.running .r{animation:legB .3s linear infinite alternate}
.running .arm{animation:legA .3s linear infinite alternate}
.running .rb{animation:bob .15s ease-in-out infinite alternate}
.runner.jog{transition:none;animation:jog 6s linear infinite}
@keyframes legA{from{transform:rotate(-38deg)}to{transform:rotate(34deg)}}
@keyframes legB{from{transform:rotate(34deg)}to{transform:rotate(-38deg)}}
@keyframes bob{to{transform:translateY(-2px)}}
@keyframes jog{from{left:6%}to{left:94%}}
.gainpop{position:absolute;top:4px;transform:translateX(-50%);font-family:var(--f-num);font-weight:700;font-size:18px;white-space:nowrap;z-index:4;text-shadow:0 1px 3px #000;animation:pop 2.2s forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,10px)}15%{opacity:1;transform:translate(-50%,0)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-8px)}}
.sugg{display:flex;gap:8px;flex-wrap:wrap;align-items:center;min-height:0}
.sugg:empty{display:none}
.sbtn{background:var(--turf-3);border:1px solid var(--chalk);border-radius:3px;padding:6px 12px;font-weight:600}
.sbtn:hover{background:var(--chalk);color:var(--turf)}
.fix{color:var(--t4)}.fix b{color:var(--chalk)}
.play{position:relative;height:108px;border-radius:6px;overflow:hidden;border:2px solid rgba(242,239,230,.5);
  background:repeating-linear-gradient(90deg,var(--turf-2) 0 5%,var(--turf-3) 5% 10%)}
.mk{position:absolute;top:0;bottom:0;border-left:2px dashed var(--mc);opacity:.3;transition:opacity .2s}
.mk span{position:absolute;top:4px;left:4px;font-family:var(--f-num);font-weight:700;font-size:13px;color:var(--mc)}
.mk.lit{opacity:1}
.play .runner{transition:none;margin-top:-12px}
.runner.tackled svg{transform:rotate(75deg) translate(6px,4px);transition:transform .25s}
.ez.td{background:var(--pylon);transition:background .2s}.ez.td b{color:var(--pylon-ink)}
.readout{display:flex;justify-content:space-between;align-items:center;gap:12px}
.readout .num{font-size:20px;color:var(--muted)}.readout b{font-size:44px;color:var(--chalk);line-height:1}
.qcard .ans{font-size:22px;font-weight:700;margin:0}
.after{display:flex;flex-direction:column;gap:14px;animation:rise .35s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.acct{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.acct b{color:var(--chalk)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--t3);margin-right:7px;vertical-align:1px}
.linkbtn{background:none;border:1px solid rgba(242,239,230,.35);border-radius:3px;padding:6px 12px;font-family:var(--f-num);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:14px}
.linkbtn:hover{border-color:var(--chalk)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.modes{grid-template-columns:1fr}}
.mode{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--turf-2);border:2px solid var(--turf-3);border-radius:6px;padding:14px;min-width:0}
.mode:hover{border-color:var(--chalk)}
.mode b{font-family:var(--f-num);font-weight:700;font-size:20px;letter-spacing:.06em;text-transform:uppercase}
.mode span{color:var(--muted);font-size:14px}
.src{font-family:var(--f-num);font-weight:700;font-size:12px;letter-spacing:.12em;padding:2px 7px;border-radius:3px;background:var(--t2);color:#0d1a12}
.det{color:var(--muted);font-weight:500;font-size:.78em;white-space:nowrap}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.fbtn{background:none;border:1px solid var(--line);border-radius:20px;padding:6px 14px;font-size:14px;color:var(--muted)}
.fbtn.on{background:var(--chalk);color:var(--turf);border-color:var(--chalk);font-weight:600}
.spark{display:flex;align-items:flex-end;gap:3px;height:70px;border-bottom:1px solid var(--line)}
.spark i{flex:1;background:var(--pylon);border-radius:2px 2px 0 0;min-width:4px}
.hrows{display:flex;flex-direction:column}
.hrow{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"d m y" "e e y";gap:2px 12px;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 2px}
.hrow:hover{background:var(--turf-2)}
.hd{grid-area:d;color:var(--muted);font-size:14px}.hm{grid-area:m;font-weight:600;min-width:0}
.he{grid-area:e;letter-spacing:2px}.hy{grid-area:y;align-self:center;font-weight:700;font-size:24px}.hy small{font-size:13px;color:var(--muted)}
.pct{display:flex;flex-direction:column;gap:8px;background:var(--turf-2);padding:16px;border-radius:6px}
.pct-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.pct-top b{font-size:28px;font-weight:700;color:var(--pylon)}
.pct-bar{position:relative;height:12px;border-radius:6px;background:linear-gradient(90deg,var(--t0),var(--t2) 50%,var(--t4) 80%,var(--t6))}
.pct-bar i{position:absolute;top:-4px;bottom:-4px;border:2px solid var(--chalk);border-radius:4px;background:rgba(242,239,230,.25);min-width:6px}
.pct-scale{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.modal{position:fixed;inset:0;z-index:50;background:rgba(5,14,9,.8);display:grid;place-items:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{width:100%;max-width:420px;background:var(--turf-2);border:2px solid rgba(242,239,230,.3);border-radius:8px;padding:22px;display:flex;flex-direction:column;gap:12px;max-height:100%;overflow:auto}
.lgform{display:flex;flex-direction:column;gap:8px}
.lgform input{background:var(--chalk);color:#0d1a12;border:0;border-radius:4px;padding:12px;font:500 16px var(--f-body)}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}.or::before,.or::after{content:"";flex:1;border-top:1px solid var(--line)}
.lglinks{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.lb{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.lb li{display:grid;grid-template-columns:2.2em 1fr auto;gap:10px;padding:8px 4px;border-bottom:1px solid var(--line);align-items:center}
.lb li.me{background:var(--turf-3)}.lb .lbn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ball{position:absolute;top:50%;width:26px;height:16px;margin:-8px 0 0 -13px;border-radius:50%;background:#8a4b22;border:2px solid #f2efe6;transition:left 1s cubic-bezier(.2,.8,.2,1);z-index:2}
.ball::after{content:"";position:absolute;left:6px;right:6px;top:5px;height:2px;background:#f2efe6}
.cta-row{display:flex;gap:12px;flex-wrap:wrap}
.btn{border:0;border-radius:4px;padding:14px 22px;font-family:var(--f-num);font-weight:700;font-size:20px;letter-spacing:.06em;text-transform:uppercase}
.btn.go{background:var(--pylon);color:var(--pylon-ink);flex:1 1 220px}
.btn.go:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border:2px solid rgba(242,239,230,.35);color:var(--chalk);flex:0 1 auto}
.btn.ghost:hover{border-color:var(--chalk)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stat{padding:12px 4px;text-align:center}
.stat+.stat{border-left:1px solid var(--line)}
.stat .v{font-family:var(--f-num);font-weight:700;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.done-note{background:var(--turf-2);border-left:4px solid var(--pylon);padding:12px 14px;margin:0}
h2{font-family:var(--f-num);text-transform:uppercase;letter-spacing:.1em;font-size:16px;font-weight:700;margin:0;color:var(--muted)}
.ladder{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.ladder li{display:grid;grid-template-columns:130px 1fr auto;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.chip{display:inline-block;min-width:0;font-family:var(--f-num);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:13px;padding:3px 9px;border-radius:3px;color:#0d1a12;white-space:nowrap}
.how{display:flex;flex-direction:column;gap:6px;margin:0;padding-left:20px}
.foot{color:var(--muted);font-size:13px}

/* ---------- PLAY ---------- */
.hud{display:flex;justify-content:space-between;align-items:center;gap:12px}
.pips{display:flex;gap:5px}
.pip{width:22px;height:8px;border-radius:2px;background:var(--t0)}
.pip.on{outline:2px solid var(--chalk);outline-offset:1px}
.yds{font-family:var(--f-num);font-weight:700;font-size:22px}
.yds small{font-size:13px;color:var(--muted);letter-spacing:.1em;margin-left:4px}
.clock{display:flex;align-items:center;gap:12px}
.clockbar{flex:1;height:10px;background:var(--turf-3);border-radius:5px;overflow:hidden}
.clockbar i{display:block;height:100%;background:var(--chalk);width:100%}
.clockbar.low i{background:var(--bad)}
.secs{font-family:var(--f-num);font-weight:700;font-size:34px;width:2.2ch;text-align:right;font-variant-numeric:tabular-nums}
.qcard{display:flex;flex-direction:column;gap:12px}
.qtag{display:flex;gap:8px;align-items:center}
.lg{font-family:var(--f-num);font-weight:700;font-size:12px;letter-spacing:.12em;padding:2px 7px;border:1px solid var(--muted);border-radius:3px;color:var(--muted)}
.q{font-family:var(--f-display);font-size:clamp(26px,6.4vw,38px);line-height:1.12;margin:0;text-wrap:balance}
.qnote{color:var(--muted);margin:0;font-size:15px}
.entry{display:flex;gap:8px}
.entry input{flex:1;min-width:0;background:var(--chalk);color:#0d1a12;border:0;border-radius:4px;padding:14px 14px;font:600 18px var(--f-body)}
.entry .btn{padding:12px 18px;font-size:18px}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.msg{min-height:24px;margin:0;color:var(--bad);font-weight:600}
.tried{display:flex;gap:6px;flex-wrap:wrap;min-height:4px}
.tried span{font-size:14px;text-decoration:line-through;color:var(--muted);background:var(--turf-2);padding:2px 8px;border-radius:3px}
.pass{align-self:flex-start;background:none;border:0;color:var(--muted);text-decoration:underline;padding:4px 0}

.reveal{display:flex;flex-direction:column;gap:14px;border-top:4px solid var(--tc,var(--t0));background:var(--turf-2);padding:20px 18px;border-radius:0 0 6px 6px}
.reveal .big{font-family:var(--f-display);font-size:clamp(30px,8vw,46px);line-height:1;margin:0;color:var(--tc)}
.reveal .ans{font-size:20px;font-weight:600;margin:0}
.reveal .gain{font-family:var(--f-num);font-weight:700;font-size:26px}
.missed{margin:0;color:var(--muted)}
.missed b{color:var(--chalk);font-weight:600}

/* ---------- RESULTS ---------- */
.score{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.score .v{font-family:var(--f-num);font-weight:700;font-size:clamp(64px,18vw,104px);line-height:.85;font-variant-numeric:tabular-nums}
.score .v small{font-size:.32em;color:var(--muted);letter-spacing:.1em;margin-left:6px}
.rating{font-family:var(--f-display);font-size:24px;color:var(--pylon);margin:0}
.rows{display:flex;flex-direction:column}
.rows details{border-bottom:1px solid var(--line)}
.rows summary{list-style:none;display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 0;cursor:pointer}
.rows summary::-webkit-details-marker{display:none}
.rows .rq{font-weight:600;min-width:0}
.rows .ra{color:var(--muted);font-size:15px;min-width:0}
.rows .rt{grid-row:1/3;grid-column:2;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.board{display:flex;flex-direction:column;gap:8px;padding:0 0 14px}
.board div{display:grid;grid-template-columns:130px 1fr;gap:10px;align-items:start;font-size:15px}
.board .you{color:var(--pylon);font-weight:700}
.share{display:flex;flex-direction:column;gap:10px;background:var(--turf-2);padding:16px;border-radius:6px}
.share pre{margin:0;font-family:var(--f-body);white-space:pre-wrap;font-size:15px;user-select:all}
@media (max-width:420px){.ladder li{grid-template-columns:104px 1fr auto}.board div{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.gainpop{opacity:1}}
</style>
</head>

/* ===================== MATCHING ===================== */
function baseNorm(s,strip){
  s=s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[&'’.]/g,"").replace(/[^a-z0-9]+/g," ");
  s=" "+s+" ";
  s=s.replace(/ the /g," ").replace(/ university of /g," ").replace(/ university /g," ").replace(/ (jr|sr|ii|iii|iv) /g," ");
  if(strip) strip.forEach(w=>{s=s.split(" "+w+" ").join(" ")});
  return s.replace(/\s+/g," ").trim();
}
function lev(a,b){
  if(Math.abs(a.length-b.length)>2)return 9;
  const d=[];for(let i=0;i<=a.length;i++){d[i]=[i]}for(let j=1;j<=b.length;j++)d[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[a.length][b.length];
}
function buildIndex(p){
  if(p._idx)return p._idx;
  const keys=[];const lastCount={};
  if(p.p)p.a.forEach(a=>{const w=baseNorm(a[1]).split(" ");const l=w[w.length-1];lastCount[l]=(lastCount[l]||0)+1});
  p.a.forEach((a,i)=>{
    const forms=new Set([a[1]].concat((a[2]||"").split("|").filter(Boolean)));
    const list=[...forms].map(f=>baseNorm(f,p.strip)).filter(Boolean);
    if(p.p){const w=baseNorm(a[1]).split(" ");const l=w[w.length-1];if(lastCount[l]===1&&l.length>2)list.push(l)}
    list.forEach(k=>keys.push({i,k,c:k.replace(/ /g,"")}));
  });
  const amb=new Set(Object.keys(lastCount).filter(k=>lastCount[k]>1));
  const no=new Set((p.no||"").split("|").filter(Boolean).map(s=>baseNorm(s).replace(/ /g,"")));
  return p._idx={keys,amb,no};
}
function match(p,raw){
  const {keys,amb,no}=buildIndex(p);
  const s=baseNorm(raw,p.strip),c=s.replace(/ /g,"");
  if(!c)return null;
  if(no.has(c))return {miss:true};
  let best=null;
  keys.forEach(k=>{if(k.c===c&&(!best||k.c.length>best.c.length))best=k});
  if(best)return {i:best.i};
  if(amb.has(c))return {amb:true,opts:p.a.filter(a=>{const w=baseNorm(a[1]).split(" ");return w[w.length-1]===c}).map(a=>a[1])};
  keys.forEach(k=>{
    if(k.c.length<3)return;
    let extra=null;
    if(s.startsWith(k.k+" "))extra=s.slice(k.k.length+1);
    else if(s.endsWith(" "+k.k))extra=s.slice(0,s.length-k.k.length-1);
    if(extra!==null&&extra.split(" ").length<=2&&(!best||k.c.length>best.c.length))best=k;
  });

const pos2=y=>10+80*Math.min(1,y/100);

function playField(){

  ${TIERS.slice(1).map((T,k)=>`<div class="mk" id="mk${k+1}" style="left:${pos2(T.y)}%;--mc:${T.c}"><span>${T.y}</span></div>`).join("")}

function runPlay(t,done){
  const target=TIERS[t].y,r=document.getElementById("runner"),ry=document.getElementById("ry"),rt=document.getElementById("rt"),play=document.getElementById("play");
  let shown=-1,skip=false;
  const setTier=ct=>{if(ct===shown)return;shown=ct;rt.textContent=ct?TIERS[ct].n:"At the line";rt.style.background=TIERS[ct].c;
    for(let k=1;k<=6;k++)document.getElementById("mk"+k).classList.toggle("lit",k<=ct)};
  const pop=(txt,c,y)=>{const g=document.createElement("div");g.className="gainpop";g.style.left=Math.min(84,pos2(y))+"%";g.style.color=c;g.textContent=txt;play.appendChild(g)};
  if(!target){setTimeout(()=>{r.classList.add("tackled");pop("Stopped at the line","var(--bad)",8)},REDUCE?0:250);setTimeout(done,REDUCE?0:900);return ()=>{}}
  const dur=REDUCE?0:450+target*20,t0=performance.now();r.classList.add("running");
  const f=now=>{const k=(dur&&!skip)?Math.min(1,(now-t0)/dur):1,e=1-Math.pow(1-k,2.4),y=target*e;
    r.style.left=pos2(y)+"%";ry.textContent=Math.round(y);
    let ct=0;for(let i=1;i<=6;i++)if(y>=TIERS[i].y-.01)ct=i;setTier(ct);
    if(k<1)requestAnimationFrame(f);
    else{r.classList.remove("running");
      if(t===6){document.getElementById("ezr").classList.add("td");pop("TOUCHDOWN","var(--pylon)",100)}
      else pop("+"+target+" yds",TIERS[t].c,target);
      setTimeout(done,REDUCE||skip?0:350)}};
  requestAnimationFrame(f);
  return ()=>{skip=true};
}
function runTo(y,gain){
  const r=document.getElementById("runner");if(!r)return;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    r.classList.add("running");r.style.left=pos(y)+"%";
    if(gain){const g=document.createElement("div");g.className="gainpop";g.style.left=pos(y)+"%";g.style.color=gain.c;g.textContent=gain.t;r.parentNode.appendChild(g)}
    setTimeout(()=>r.classList.remove("running"),gain&&gain.t==="No gain"?200:1450);
  }));
}

function ask(){
  const p=game.prompts[game.idx];let left=25,tried=[];
  app.innerHTML=`${hud()}
  ${playField()}

  <div class="qcard">
    <div class="qtag"><span class="lg">${esc(p.lg)}</span>${p.src?'<span class="src">REAL DATA</span>':""}<span class="eyebrow">Prompt ${game.idx+1} of 7</span></div>

    <div class="sugg" id="sugg"></div>

    <button class="pass" id="pass" type="button">Punt on this one</button>
  </div>`;

  const t0=Date.now();
  const tick=()=>{left=Math.max(0,25-(Date.now()-t0)/1000);
    document.getElementById("secs").textContent=Math.ceil(left);
    document.getElementById("cbi").style.width=(left/25*100)+"%";

    if(left<=0){clearInterval(timer);finish(null,tried)}};
  clearInterval(timer);timer=setInterval(tick,100);
  document.getElementById("pass").onclick=()=>{clearInterval(timer);finish(null,tried)};
  const sugg=document.getElementById("sugg"),msg=document.getElementById("msg");
  const offer=(names,label)=>{sugg.innerHTML=`<span class="eyebrow">${label}</span>`+names.map(n=>`<button type="button" class="sbtn">${esc(n)}</button>`).join("");
    sugg.querySelectorAll(".sbtn").forEach(b=>b.onclick=()=>{inp.value=b.textContent;sugg.innerHTML="";msg.textContent="";inp.focus()})};
  inp.oninput=()=>{msg.textContent="";const v=inp.value.trim();sugg.innerHTML="";if(v.length<4)return;
    const m=match(p,v);if(m&&m.fuzzy)offer([p.a[m.i][1]],"Did you mean");};
  document.getElementById("f").onsubmit=e=>{
    e.preventDefault();const v=inp.value.trim();if(!v)return;
    const m=match(p,v);
    if(m&&m.i!==undefined&&!m.fuzzy){clearInterval(timer);finish(m.i,tried);return}
    if(m&&m.fuzzy){inp.value=p.a[m.i][1];sugg.innerHTML="";msg.innerHTML=`<span class="fix">Close. We filled in <b>${esc(p.a[m.i][1])}</b>. Press Snap to lock it in.</span>`;inp.focus();inp.select();return}
    if(m&&m.amb){msg.textContent="Two or more players on this board share that last name. Add a first name.";if(m.opts.length===2)offer(m.opts,"Which one?");return}
    msg.textContent="Not on the board.";sugg.innerHTML="";tried.push(v);
    document.getElementById("tried").innerHTML=tried.map(t=>`<span>${esc(t)}</span>`).join("");
    inp.value="";const f=document.getElementById("f");f.classList.remove("shake");void f.offsetWidth;f.classList.add("shake");
  };
}

function finish(i,tried){
  const p=game.prompts[game.idx];
  const t=i===null?0:p.a[i][0];
  game.res.push({id:p.id,t,ans:i===null?null:p.a[i][1]});
  const prevY=game.yards;game.yards+=TIERS[t].y;
  const better=p.a.filter(a=>a[0]>t).sort((a,b)=>b[0]-a[0]).slice(0,3);
  const last=game.idx===6;
  app.innerHTML=`${hud()}
  <div class="qcard"><div class="qtag"><span class="lg">${esc(p.lg)}</span><span class="eyebrow">Prompt ${game.idx+1} of 7</span></div>
    <h2 class="q" style="font-size:clamp(20px,5vw,26px)">${esc(p.q)}</h2>
    ${i!==null?`<p class="ans">${esc(p.a[i][1])}${p.a[i][3]?` <span class="det">${esc(p.a[i][3])}</span>`:""}</p>`:`<p class="ans" style="color:var(--muted)">No answer</p>`}</div>
  <div class="readout"><span class="num"><b id="ry">0</b> yds</span><span class="chip" id="rt" style="background:var(--t0)">At the line</span></div>
  ${playField()}
  <div id="after" class="after" hidden>
    <div class="reveal" style="--tc:${TIERS[t].c}">
      <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap">
        <p class="big">${TIERS[t].n}</p><span class="gain" style="color:${TIERS[t].c}">+${TIERS[t].y} yds</span></div>
      ${better.length?`<p class="missed">${t===0?"On the board, for example":"Deeper answers available"}: ${better.map(a=>`<b>${esc(a[1])}</b> (${TIERS[a[0]].n})`).join(", ")}</p>`:`<p class="missed">Touchdown. That's the deepest tier on this board.</p>`}
    </div>
    <button class="btn go" id="next">${last?"See final score":"Next prompt"}</button>
  </div>
  <button class="pass" id="skip" type="button">Skip the run</button>`;
  const yd=document.getElementById("yds");yd.innerHTML=prevY+"<small>YDS</small>";
  const skipBtn=document.getElementById("skip");
  const stop=runPlay(t,()=>{
    document.getElementById("after").hidden=false;skipBtn.remove();yd.innerHTML=game.yards+"<small>YDS</small>";
    const nx=document.getElementById("next");nx.focus();
    nx.onclick=()=>{if(last)end();else{game.idx++;ask()}};
  });
  skipBtn.onclick=stop;
}

function end(){
  const n=game.mode==="daily"?game.n:histList().filter(h=>h.mode===game.mode).length+1;
  const rec={mode:game.mode,n,day:game.n,yards:game.yards,res:game.res,at:Date.now()};
  store=load();store.last[game.mode]=game.prompts.map(p=>p.id);save(store);
  record(rec);results(rec);
}

function results(rec,fromHist){
  clearInterval(timer);screen="results";
  const mode=rec.mode||"daily",n=rec.n;
  const label=mode==="daily"?"Daily Drive #"+n:MODE_NAME[mode]+" · Drive "+n;
  const share=`Yardillion ${mode==="daily"?"#"+n:MODE_NAME[mode]} · ${rec.yards} yds${mode==="daily"?` (top ${100-pctRange(rec.yards)[1]}–${100-pctRange(rec.yards)[0]}%)`:""}\n${rec.res.map(r=>TIERS[r.t].e).join("")}\n${rating(rec.yards)}`;
  app.innerHTML=`
  <div class="masthead"><span class="eyebrow">${esc(label)}</span><span class="eyebrow">${fromHist?new Date(rec.at).toLocaleDateString():"Final"}</span></div>
  <div class="score"><div class="v">${rec.yards}<small>YDS</small></div><p class="rating">${rating(rec.yards)}</p></div>
  ${field(0,true)}
  ${mode==="daily"?pctHtml(rec.yards)+`<div id="rank"></div>`:""}
  <h2>Your drive</h2>
  <div class="rows">${rec.res.map(r=>{const p=BYID[r.id];if(!p)return"";
    const groups=[6,5,4,3,2,1].map(t=>[t,p.a.filter(a=>a[0]===t)]).filter(g=>g[1].length);
    return `<details><summary><span class="rq">${p.src?'<span class="src">REAL DATA</span> ':""}${esc(p.q)}</span><span class="ra">${r.ans?esc(r.ans):"No answer"} · tap for the full board (${p.a.length})</span>
    <span class="rt">${chip(r.t)}<span class="num" style="font-weight:700">+${TIERS[r.t].y}</span></span></summary>
    <div class="board">${groups.map(g=>`<div>${chip(g[0])}<span>${g[1].map(a=>{const nm=esc(a[1])+(a[3]?` <span class="det">${esc(a[3])}</span>`:"");return a[1]===r.ans?`<span class="you">${nm}</span>`:nm}).join(", ")}</span></div>`).join("")}</div></details>`}).join("")}</div>
  <div class="share"><span class="eyebrow">Share your drive</span><pre id="sh">${esc(share)}</pre>
    <button class="btn ghost" id="copy" style="align-self:flex-start;font-size:16px;padding:10px 16px">Copy result</button></div>
  <div class="cta-row"><button class="btn go" id="again">${mode==="daily"?"Play unlimited":mode==="dive"?"Next data dive":"Next drive"}</button>
    ${fromHist?`<button class="btn ghost" id="toHist">Back to history</button>`:`<button class="btn ghost" id="toHist">My history</button>`}<button class="btn ghost" id="home">Home</button></div>`;
  document.getElementById("copy").onclick=e=>{
    const b=e.currentTarget;
    const sel=()=>{const r=document.createRange();r.selectNodeContents(document.getElementById("sh"));const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent="Selected. Copy it."};
    try{navigator.clipboard.writeText(share).then(()=>b.textContent="Copied",sel)}catch(err){sel()}
  };
  runTo(rec.yards,{t:rating(rec.yards),c:"var(--pylon)"});
  if(mode==="daily")fillRank(rec);
  document.getElementById("again").onclick=()=>startGame(mode==="dive"?"dive":"unlimited");
  document.getElementById("toHist").onclick=historyView;
  document.getElementById("home").onclick=home;
}
home();initAccount();
</script>

</body>
</html>
